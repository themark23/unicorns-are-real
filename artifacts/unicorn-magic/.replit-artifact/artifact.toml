kind = "mobile"
previewPath = "/"
title = "Unicorn Magic"
version = "1.0.0"
id = "artifacts/unicorn-magic"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21488

[services.development]
run = "pnpm --filter @workspace/unicorn-magic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/unicorn-magic", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/unicorn-magic", "run", "serve" ]

[services.env]
PORT = "21488"
BASE_PATH = "/"
